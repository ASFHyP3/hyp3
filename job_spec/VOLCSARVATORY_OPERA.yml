VOLCSARVATORY_OPERA:
  required_parameters:
    - aoi
    - name
  parameters:
    aoi:
      api_schema:
        type: array
        minItems: 4
        maxItems: 4
        example:
          - -168.5
          - 53.2
          - -167.5
          - 53.6
        items:
          description: Coordinates of the Area of Interest
          type: number
          minimum: -180.0
          maximum: 180.0
          example: -169.01
    name:
      api_schema:
        description: Name of the AOI.
        type: string
    publish_bucket:
      api_schema:
        description: Publish the resulting product to the VolcSARvatory S3 Bucket
        type: string
        nullable: true
        enum:
          - null
          - "volcsarvatory-data"
          - "volcsarvatory-data-test"
        default: null
    publish_prefix:
      api_schema:
        description: Prefix to store the resulting product.
        type: string
        nullable: true
        default: null
  cost_profiles:
    DEFAULT:
      cost: 1.0
  validators: []
  steps:
    - name: ''
      image: ghcr.io/asfhyp3/hyp3-mintpy
      command:
        - ++process
        - opera_ts
        - --bucket
        - Ref::bucket
        - --bucket-prefix
        - Ref::bucket_prefix
        - --aoi
        - Ref::aoi
        - --name
        - Ref::name
        - --publish-bucket
        - Ref::publish_bucket
        - --publish-prefix
        - Ref::publish_prefix
      timeout: 126000  # 35 hours
      compute_environment: Default
      vcpu: 1
      memory: 30500
      secrets:
        - EARTHDATA_USERNAME
        - EARTHDATA_PASSWORD
        - PUBLISH_ACCESS_KEY_ID
        - PUBLISH_SECRET_ACCESS_KEY
