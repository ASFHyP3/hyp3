GLACIER_MELT:
  required_parameters:
    - opera_burst_id
    - start_date
    - end_date

  parameters:
    opera_burst_id:
      api_schema:
        type: array
        description: OPERA Sentinel-1 burst identifiers to process together.
        minItems: 1
        maxItems: 2
        uniqueItems: true
        example:
          - T014_028627_IW2
          - T014_028628_IW2
        items:
          type: string
          pattern: '^T[0-9]{3}_[0-9]{6}_IW[1-3]$'
    start_date:
      api_schema:
        type: string
        format: date
        description: First OPERA acquisition date, in YYYY-MM-DD format.
        example: '2017-01-01'

    end_date:
      api_schema:
        type: string
        format: date
        description: Last OPERA acquisition date, in YYYY-MM-DD format.
        example: '2024-12-31'

  cost_profiles:
    DEFAULT:
      cost: 1.0

  validators: []

  steps:
    - name: ''
      image: ghcr.io/jsingh2344/hyp3-glacier-melt
      image_tag: 'test'

      command:
        - --bucket
        - Ref::bucket
        - --bucket-prefix
        - Ref::bucket_prefix
        - --opera-burst-id
        - Ref::opera_burst_id
        - --start-date
        - Ref::start_date
        - --end-date
        - Ref::end_date

      timeout: 3600
      compute_environment: Default
      vcpu: 2
      memory: 7600

      secrets:
        - EARTHDATA_USERNAME
        - EARTHDATA_PASSWORD
