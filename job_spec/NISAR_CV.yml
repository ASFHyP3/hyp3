NISAR_CV:
  required_parameters:
    - start_date
    - end_date
    - relative_orbit
    - orbit_direction
    - frame_number
  parameters:
    start_date:
      api_schema:
        description: Start date of CV calculation in YYYY-MM-DD format
        type: str
        pattern: "[0-9]{4}-[0-1][0-9]-[0-3][0-9]"
        example: 2026-06-24
    end_date:
      api_schema:
        description: End date of CV calculation in YYYY-MM-DD format
        type: str
        pattern: "[0-9]{4}-[0-1][0-9]-[0-3][0-9]"
        example: 2026-08-12
    relative_orbit:
      api_schema:
        description: NISAR relative orbit number.
        type: integer
        minimum: 001
        maximum: 173
        example: 148
    orbit_direction:
      api_schema:
        description: NISAR orbit direction parameter. A = Ascending, D = Descending
        type: string
        enum:
          - A
          - D
        example: A
    frame_number:
      api_schema:
        description: NISAR track frame number containing scene.
        type: integer
        minimum: 001
        maximum: 176
        example: 024
    pol:
      api_schema:
        description: Polarization of input granules to use.
        type: string
        enum:
          - HHHH
          - HVHV
        default: HHHH
    subset:
      api_schema:
        description: Geographic subset of the granules to use, in the format of a WKT string.
        type: string
        default: ''
        example: POLYGON((-91.2399 45.1589,-90.7532 45.1589,-90.7532 45.4609,-91.2399 45.4609,-91.2399 45.1589))
    crop_area:
      api_schema:
        description: Choose whether to generate a crop area classification map. If False, only a coefficient of variation file is created.
        type: boolean
        default: false
    cv_threshold:
      api_schema:
        description: Coefficient of variation threshold to use for crop area classification.
        type: number
        format: float
        minimum: 0.0
        default: 0.4
        example: 0.4
    water_threshold_db:
      api_schema:
        description: Backscatter threshold, in decibels, for watermask generation. Pixels with backscatter below this threshold in more than --water-fraction % of images are classified as water.
        type: number
        format: float
        default: -16.5
        example: -16.5
    water_fraction:
      api_schema:
        type: number
        format: float
        description: Fraction of images in which the backscatter of a pixel is below --water-threshold-db in order for the pixel to be classified as water.
        minimum: 0.0
        default: 0.75
        example: 0.75
  cost_profiles:
    DEFAULT:
      cost: 1.0
  validators: []
  steps:
    - name: ''
      image: ghcr.io/asfhyp3/hyp3-nisar-cv
      command:
        - Ref::start_date
        - Ref::end_date
        - Ref::relative_orbit
        - Ref::orbit_direction
        - Ref::frame_number
        - --pol
        - Ref::pol
        - --subset
        - Ref::subset
        - --crop-area
        - Ref::crop_area
        - --cv-threshold
        - Ref::cv_threshold
        - --water-threshold-db
        - Ref::water_threshold_db
        - --water-fraction
        - Ref::water_fraction
        - --bucket
        - Ref::bucket
        - --bucket-prefix
        - Ref::bucket_prefix
      timeout: 10800
      compute_environment: Default
      vcpu: 1
      memory: 15500
      secrets:
        - EARTHDATA_USERNAME
        - EARTHDATA_PASSWORD
